name: hosting-standard self-test

# Runs the hosting-standard check's unit tests: every rule is exercised failing as well as passing.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: hosting-standard-selftest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: hosting-standard self-test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
      - name: unit tests
        run: python3 -I -m unittest discover -s hosting-standard/tests -v
