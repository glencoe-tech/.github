name: repo-minimum-gates

# The Engineering Quality Standard's floor (§2): every repo in every governed org runs AT LEAST
# a secret scan and a build on PR. This is the single shared implementation — repos call it with
# a two-line workflow so the floor has one definition, one pin set, and one place to improve.
#
# Callers pin this workflow by commit SHA (EQS §1 rule 5 — no mutable refs in CI).
#
# RUNNERS: GitHub bills the CALLER of a reusable workflow, not the repo that defines it. This repo
# is public (its own runs are free), but a PRIVATE caller spends its own org's Actions allowance on
# every job below. When that allowance is exhausted the jobs are refused a runner and fail in ~2s
# with zero steps executed — a red check that looks like a gate failure but is really a gate that
# never ran. `runs-on` exists so such a caller can move the floor onto the estate CI appliance
# instead of losing it. The default stays GitHub-hosted so public and fork-PR callers are unaffected.

on:
  workflow_call:
    inputs:
      runs-on:
        description: >-
          Runner target for BOTH gate jobs — a single label ("ubuntu-latest") or a JSON array of
          labels ('["self-hosted", "avenra-ci"]').

          Defaults to GitHub-hosted ubuntu-latest. Leave it at the default for PUBLIC callers
          (hosted minutes are free) and for any caller that accepts FORK pull requests — untrusted
          contributor code must never be scheduled onto the shared self-hosted appliance.

          A PRIVATE caller whose org has exhausted its hosted Actions allowance should pass
          '["self-hosted", "avenra-ci"]' to run the floor on the estate CI appliance
          (AvenraCloud/avenra-infra infra/ci-runner, docs/SELF-HOSTED-RUNNERS.md). Both jobs below
          hold nothing beyond the default read-only GITHUB_TOKEN, which makes them box-eligible
          under the estate runner rule.
        type: string
        required: false
        default: ubuntu-latest

permissions:
  contents: read

jobs:
  secret-scan:
    name: secret scan (gitleaks, full history)
    # A JSON array is decoded into a label list; a bare label is passed through as a string.
    runs-on: ${{ startsWith(inputs.runs-on, '[') && fromJSON(inputs.runs-on) || inputs.runs-on }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # scan history, not just the tip — leaked-then-deleted is still leaked
      - name: install gitleaks (pinned, checksum-verified)
        env:
          GITLEAKS_VERSION: "8.24.3"
          GITLEAKS_SHA256: "9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c"
        run: |
          set -euo pipefail
          # Tools install into the per-job $RUNNER_TEMP, never the shared /usr/local or /tmp:
          # eighteen runner slots share one box, so two jobs installing the same binary race
          # (GNU install truncates the destination then chmods it — a reader that execs in that
          # window gets EACCES), and a fixed /tmp path collides outright.
          mkdir -p "${RUNNER_TEMP}/bin"
          # GITHUB_PATH only affects LATER steps, so export for this one too.
          echo "${RUNNER_TEMP}/bin" >> "${GITHUB_PATH}"
          export PATH="${RUNNER_TEMP}/bin:${PATH}"
          curl -fsSL --retry 3 \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            -o gitleaks.tgz
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum --check --strict -
          tar -xzf gitleaks.tgz gitleaks
          install -m0755 gitleaks "${RUNNER_TEMP}/bin/gitleaks"
          gitleaks version
      - name: scan
        run: gitleaks detect --source . --redact --no-banner

  build:
    name: build (must succeed on PR)
    # A JSON array is decoded into a label list; a bare label is passed through as a string.
    runs-on: ${{ startsWith(inputs.runs-on, '[') && fromJSON(inputs.runs-on) || inputs.runs-on }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: build if buildable — never silently skip
        run: |
          set -euo pipefail
          if [ -f package.json ] && node -e "process.exit(((require('./package.json').scripts||{}).build)?0:1)"; then
            echo "package.json build script detected"
            if [ -f package-lock.json ]; then npm ci; else
              echo "::warning::no package-lock.json — install is not reproducible; commit a lockfile (EQS rule 5)"
              npm install
            fi
            npm run build
          elif [ -f index.html ] || [ -d public ] || [ -d dist ]; then
            echo "static site — no build step to run; secret scan is the effective gate"
          else
            echo "::warning::no build script and no static entrypoint detected — declare this repo's tier and build story in its README (EQS §2)"
          fi
