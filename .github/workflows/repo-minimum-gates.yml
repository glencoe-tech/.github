name: repo-minimum-gates

# The Engineering Quality Standard's floor (§2): every repo in every governed org runs AT LEAST
# a secret scan and a build on PR. This is the single shared implementation — repos call it with
# a two-line workflow so the floor has one definition, one pin set, and one place to improve.
#
# Callers pin this workflow by commit SHA (EQS §1 rule 5 — no mutable refs in CI).
#
# RUNNERS: reusable jobs are billed to their caller. Avenra is the permanent default;
# billing resets do not change runner placement. The retired `[self-hosted, avenra-ci]`
# pool is not a valid target. Public callers need access to an approved isolated Avenra
# runner group before enabling these gates; never expose a shared credential lane to forks.

on:
  workflow_call:
    inputs:
      runs-on:
        description: >-
          Avenra runner target for both gate jobs. Defaults to avenra-ci-k8s.
          Accepts a scalar label or JSON array. Use an approved isolated lane for public callers.
        type: string
        required: false
        default: avenra-ci-k8s
      npm-scope:
        description: >-
          npm scope installed from GitHub Packages (e.g. "@glencoe-tech"). Empty: public registry
          only. Needs the npm-registry-token secret.
        type: string
        required: false
        default: ""
    secrets:
      npm-registry-token:
        description: >-
          Token for GitHub Packages when npm-scope is set: the caller passes its own
          secrets.GITHUB_TOKEN from a job that grants `packages: read`. Not a GitHub App token:
          npm.pkg.github.com rejects those (measured in axentra-atlas, 2026-08-20). This
          workflow requests no permission beyond `contents: read`; the caller opts in.
        required: false

permissions:
  contents: read

jobs:
  secret-scan:
    name: secret scan (gitleaks, full history)
    # A JSON array is decoded into a label list; a bare label is passed through as a string.
    runs-on: ${{ startsWith(inputs.runs-on, '[') && fromJSON(inputs.runs-on) || inputs.runs-on }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # scan history, not just the tip — leaked-then-deleted is still leaked
      - name: install gitleaks (pinned, checksum-verified)
        env:
          GITLEAKS_VERSION: "8.24.3"
          GITLEAKS_SHA256: "9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c"
        run: |
          set -euo pipefail
          # Tools install into the per-job $RUNNER_TEMP, never the shared /usr/local or /tmp:
          # eighteen runner slots share one box, so two jobs installing the same binary race
          # (GNU install truncates the destination then chmods it — a reader that execs in that
          # window gets EACCES), and a fixed /tmp path collides outright.
          mkdir -p "${RUNNER_TEMP}/bin"
          # GITHUB_PATH only affects LATER steps, so export for this one too.
          echo "${RUNNER_TEMP}/bin" >> "${GITHUB_PATH}"
          export PATH="${RUNNER_TEMP}/bin:${PATH}"
          curl -fsSL --retry 3 \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            -o gitleaks.tgz
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum --check --strict -
          tar -xzf gitleaks.tgz gitleaks
          install -m0755 gitleaks "${RUNNER_TEMP}/bin/gitleaks"
          gitleaks version
      - name: scan
        run: gitleaks detect --source . --redact --no-banner

  build:
    name: build (must succeed on PR)
    # A JSON array is decoded into a label list; a bare label is passed through as a string.
    runs-on: ${{ startsWith(inputs.runs-on, '[') && fromJSON(inputs.runs-on) || inputs.runs-on }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Build on the Node the repo declares (.nvmrc, then .node-version), as its own CI and its
      # deploy do. A hard-coded version passed or failed repos on a runtime they never run on
      # (urbanova-fest pins 24; Node 20 could not load its build script). Repos that declare
      # nothing get the current LTS, never an end-of-life line (Node 20 ended 2026-04-30).
      - name: resolve the repo's Node version
        id: node
        run: |
          set -euo pipefail
          for f in .nvmrc .node-version; do
            if [ -f "$f" ]; then echo "file=$f" >> "$GITHUB_OUTPUT"; echo "Node from $f: $(cat "$f")"; exit 0; fi
          done
          echo "version=24" >> "$GITHUB_OUTPUT"
          echo "::notice::no .nvmrc or .node-version — building on Node 24 (LTS); declare the repo's runtime"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ${{ steps.node.outputs.file }}
          node-version: ${{ steps.node.outputs.version }}
          # Empty unless the caller opts in; setup-node then writes no registry config.
          registry-url: ${{ inputs.npm-scope != '' && 'https://npm.pkg.github.com' || '' }}
          scope: ${{ inputs.npm-scope }}
      # Install the way the repo's own CI and deploy do: from its committed lockfile, with its
      # package manager. Installing a pnpm repo with an unpinned `npm install` resolved a
      # different tree than the one it ships and failed builds its deploy passes (afroswitch).
      - name: build if buildable — never silently skip
        env:
          NPM_SCOPE: ${{ inputs.npm-scope }}
          NODE_AUTH_TOKEN: ${{ secrets.npm-registry-token }}
        run: |
          set -euo pipefail
          if [ -n "$NPM_SCOPE" ] && [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::npm-scope is $NPM_SCOPE but no npm-registry-token was passed; grant packages: read on the calling job and pass secrets.GITHUB_TOKEN"
            exit 1
          fi
          if [ -f package.json ] && node -e "process.exit(((require('./package.json').scripts||{}).build)?0:1)"; then
            echo "package.json build script detected"
            if [ -f pnpm-lock.yaml ]; then
              # corepack runs the pnpm that package.json `packageManager` declares.
              node -e "process.exit(/^pnpm@/.test(require('./package.json').packageManager||'')?0:1)" ||
                echo "::warning::pnpm-lock.yaml but no \"packageManager\": \"pnpm@<version>\" in package.json — the pnpm version is not pinned; declare it"
              corepack enable
              pnpm install --frozen-lockfile
              pnpm run build
            else
              if [ -f package-lock.json ]; then npm ci; else
                echo "::warning::no lockfile — install is not reproducible; commit one (EQS rule 5)"
                npm install
              fi
              npm run build
            fi
          elif [ -f index.html ] || [ -d public ] || [ -d dist ]; then
            echo "static site — no build step to run; secret scan is the effective gate"
          else
            echo "::warning::no build script and no static entrypoint detected — declare this repo's tier and build story in its README (EQS §2)"
          fi

  hosting-standard:
    name: hosting standard (right-sized hosting tier)
    # glencoe-tech/governance docs/HOSTING-COST-STANDARD.md: no run_worker_first true, a README
    # `## Hosting` record naming a tier, and a Cloudflare config that matches it. Repositories with
    # no Cloudflare config pass.
    runs-on: ${{ startsWith(inputs.runs-on, '[') && fromJSON(inputs.runs-on) || inputs.runs-on }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: glencoe-tech/.github/hosting-standard@a00194bce398f74b92dc1ff3377cf683b562ab6e # PR #17
