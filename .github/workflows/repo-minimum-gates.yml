name: repo-minimum-gates

# The Engineering Quality Standard's floor (§2): every repo in every governed org runs AT LEAST
# a secret scan and a build on PR. This is the single shared implementation — repos call it with
# a two-line workflow so the floor has one definition, one pin set, and one place to improve.
#
# Callers pin this workflow by commit SHA (EQS §1 rule 5 — no mutable refs in CI).

on:
  workflow_call: {}

permissions:
  contents: read

jobs:
  secret-scan:
    name: secret scan (gitleaks, full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # scan history, not just the tip — leaked-then-deleted is still leaked
      - name: install gitleaks (pinned, checksum-verified)
        env:
          GITLEAKS_VERSION: "8.24.3"
          GITLEAKS_SHA256: "9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c"
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            -o gitleaks.tgz
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum --check --strict -
          tar -xzf gitleaks.tgz gitleaks
          sudo install -m0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: scan
        run: gitleaks detect --source . --redact --no-banner

  build:
    name: build (must succeed on PR)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: build if buildable — never silently skip
        run: |
          set -euo pipefail
          if [ -f package.json ] && node -e "process.exit(((require('./package.json').scripts||{}).build)?0:1)"; then
            echo "package.json build script detected"
            if [ -f package-lock.json ]; then npm ci; else
              echo "::warning::no package-lock.json — install is not reproducible; commit a lockfile (EQS rule 5)"
              npm install
            fi
            npm run build
          elif [ -f index.html ] || [ -d public ] || [ -d dist ]; then
            echo "static site — no build step to run; secret scan is the effective gate"
          else
            echo "::warning::no build script and no static entrypoint detected — declare this repo's tier and build story in its README (EQS §2)"
          fi
